[pytest]
testpaths = tests
pythonpath = .
addopts = -q
filterwarnings =
    # rasterio still uses `*` for affine matmul internally; not ours to fix
    ignore:Use `@` matmul instead of `\*` mul operator:PendingDeprecationWarning
    # movingpandas warns about an optional trajectory-smoother dependency
    # (Stone Soup) we never import or need for track reconstruction/CPA.
    ignore:Missing optional dependencies:UserWarning
