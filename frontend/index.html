<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SAR Oil Spill Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body class="bg-zinc-950 text-zinc-100 font-sans overflow-hidden">
    <div id="app" class="h-screen w-screen relative">
      <!-- Globe: full-viewport base layer -->
      <div class="absolute inset-0 z-0">
        <div id="globe-container" class="w-full h-full">
          <canvas id="globe-canvas" class="w-full h-full"></canvas>
          <canvas id="globe-overlay" class="absolute inset-0 w-full h-full pointer-events-none"></canvas>
        </div>
      </div>

      <!-- Header bar -->
      <header class="absolute top-0 left-0 right-0 h-14 flex items-center px-5 justify-between z-40 pointer-events-none">
        <div class="flex items-center gap-3 pointer-events-auto">
          <div class="flex items-center gap-2.5">
            <div class="relative">
              <svg class="w-6 h-6 text-amber-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 2L2 22h20L12 2z"/>
                <path d="M12 8v4"/>
                <path d="M12 16h.01"/>
              </svg>
              <div class="absolute -top-0.5 -right-0.5 w-2 h-2 bg-red-500 rounded-full animate-pulse"></div>
            </div>
            <div>
              <h1 class="text-sm font-bold tracking-tight text-white">SAR<span class="text-amber-400">Oil</span>Spill</h1>
              <p class="text-[10px] text-zinc-500 font-medium -mt-0.5">Detection & Attribution</p>
            </div>
          </div>
        </div>
        <div class="flex items-center gap-2 pointer-events-auto">
          <button id="run-list-toggle" class="hidden text-xs px-3 py-1.5 rounded-lg bg-zinc-800/80 backdrop-blur border border-zinc-700/50 text-zinc-300 hover:bg-zinc-700 hover:text-white transition-all duration-200">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
          </button>
          <button id="report-btn" hidden class="text-xs px-3 py-1.5 rounded-lg bg-blue-600/90 backdrop-blur border border-blue-500/50 text-white hover:bg-blue-500 transition-all duration-200 font-medium shadow-lg shadow-blue-900/30" title="Open the incident report for the selected spill">
            <span class="flex items-center gap-1.5">
              <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14,2 14,8 20,8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
              Report
            </span>
          </button>
          <button id="refresh-btn" class="text-xs px-3 py-1.5 rounded-lg bg-zinc-800/80 backdrop-blur border border-zinc-700/50 text-zinc-300 hover:bg-zinc-700 hover:text-white transition-all duration-200" title="Refresh from backend">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 11-6.219-8.56"/><polyline points="21 3 21 9 15 9"/></svg>
          </button>
          <button id="clear-btn" class="text-xs px-3 py-1.5 rounded-lg bg-zinc-800/80 backdrop-blur border border-zinc-700/50 text-zinc-300 hover:bg-zinc-700 hover:text-white transition-all duration-200">
            Clear
          </button>
        </div>
      </header>

      <!-- RunList: collapsible left sidebar -->
      <aside id="run-list-panel" class="absolute top-14 left-0 bottom-0 w-80 z-20 bg-zinc-900/95 backdrop-blur-xl border-r border-zinc-800/50 flex flex-col overflow-hidden transition-transform duration-300 -translate-x-full lg:translate-x-0">
        <div class="p-4 border-b border-zinc-800/50">
          <div class="flex items-center justify-between">
            <h2 class="text-xs font-bold text-zinc-300 uppercase tracking-widest">Spills</h2>
            <span id="spill-count" class="text-[10px] px-2 py-0.5 rounded-full bg-zinc-800 text-zinc-400 font-mono">0</span>
          </div>
          <div id="spill-stats" class="mt-3 grid grid-cols-3 gap-2">
            <div class="text-center p-2 rounded-lg bg-zinc-800/50">
              <div id="stat-total" class="text-lg font-bold text-zinc-100">0</div>
              <div class="text-[10px] text-zinc-500 uppercase">Total</div>
            </div>
            <div class="text-center p-2 rounded-lg bg-red-900/20 border border-red-900/30">
              <div id="stat-alerted" class="text-lg font-bold text-red-400">0</div>
              <div class="text-[10px] text-red-500/70 uppercase">Alerted</div>
            </div>
            <div class="text-center p-2 rounded-lg bg-emerald-900/20 border border-emerald-900/30">
              <div id="stat-area" class="text-lg font-bold text-emerald-400">0</div>
              <div class="text-[10px] text-emerald-500/70 uppercase">km&sup2;</div>
            </div>
          </div>
        </div>
        <div id="run-list" class="flex-1 overflow-y-auto"></div>
      </aside>

      <!-- SpillOverlay: bottom-right detail card -->
      <div id="spill-overlay" class="absolute bottom-4 right-4 z-20 w-96 max-h-[65vh] overflow-y-auto"></div>

      <!-- VesselDrawer: bottom drawer -->
      <div id="vessel-drawer" class="absolute bottom-0 left-0 right-0 z-20 bg-zinc-900/98 backdrop-blur-xl border-t border-zinc-800/50 transition-transform duration-300 translate-y-full">
        <div class="flex items-center justify-between px-5 py-3 border-b border-zinc-800/50">
          <div class="flex items-center gap-3">
            <h3 class="text-xs font-bold text-zinc-300 uppercase tracking-widest">Vessels</h3>
            <span id="vessel-count-badge" class="text-[10px] px-2 py-0.5 rounded-full bg-zinc-800 text-zinc-400 font-mono hidden">0</span>
          </div>
          <button id="vessel-drawer-close" class="text-zinc-500 hover:text-zinc-300 transition-colors p-1 rounded hover:bg-zinc-800">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
          </button>
        </div>
        <div id="vessel-drawer-content" class="max-h-[35vh] overflow-y-auto"></div>
      </div>

      <!-- Globe legend: top-right, clear of RunList -->
      <div id="globe-legend" class="absolute top-16 right-4 z-20 bg-zinc-900/95 backdrop-blur-xl border border-zinc-700/50 rounded-xl p-3 text-xs space-y-1.5 shadow-2xl shadow-black/30">
        <div class="font-bold text-zinc-300 mb-2 uppercase tracking-wider text-[10px]">Alert Status</div>
        <div class="flex items-center gap-2.5"><div class="w-3 h-3 rounded-full shadow-lg shadow-red-500/30" style="background:rgb(255,77,77)"></div><span class="text-zinc-300 font-medium">New Spill</span></div>
        <div class="flex items-center gap-2.5"><div class="w-3 h-3 rounded-full shadow-lg shadow-orange-500/30" style="background:rgb(255,140,38)"></div><span class="text-zinc-300 font-medium">Update</span></div>
        <div class="flex items-center gap-2.5"><div class="w-3 h-3 rounded-full shadow-lg shadow-yellow-500/30" style="background:rgb(242,217,51)"></div><span class="text-zinc-300 font-medium">Possible</span></div>
        <div class="flex items-center gap-2.5"><div class="w-3 h-3 rounded-full" style="background:rgb(102,102,102)"></div><span class="text-zinc-500 font-medium">No Alert</span></div>
        <div class="pt-1.5 mt-1.5 border-t border-zinc-800/50">
          <div class="font-bold text-zinc-300 mb-1.5 uppercase tracking-wider text-[10px]">Marker Size</div>
          <div class="flex items-center gap-2 text-zinc-500">
            <svg class="w-4 h-4" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1"/></svg>
            <span>= Confidence</span>
          </div>
        </div>
      </div>

      <!-- Empty-state hint -->
      <div id="globe-hint" class="absolute bottom-8 left-1/2 -translate-x-1/2 z-10 text-zinc-500 text-xs pointer-events-none transition-opacity duration-300 flex items-center gap-2">
        <svg class="w-4 h-4 animate-bounce" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 15l-2 5L9 9l11 4-5 2zm0 0l5 5"/></svg>
        Select a spill to view details
      </div>

      <!-- Loading state: centered spinner -->
      <div id="loading-state" class="absolute inset-0 z-50 flex items-center justify-center bg-zinc-950/70 backdrop-blur-sm" style="display: flex;">
        <div class="flex flex-col items-center gap-4">
          <div class="relative">
            <div class="w-10 h-10 border-2 border-zinc-700 border-t-amber-400 rounded-full animate-spin"></div>
            <div class="absolute inset-0 w-10 h-10 border-2 border-transparent border-b-blue-500 rounded-full animate-spin" style="animation-direction: reverse; animation-duration: 1.5s;"></div>
          </div>
          <div class="text-center">
            <span class="text-sm text-zinc-300 font-medium">Loading spills...</span>
            <span class="block text-xs text-zinc-500 mt-1">Connecting to backend API</span>
          </div>
        </div>
      </div>

      <!-- Error state: centered message with retry -->
      <div id="error-state" class="absolute inset-0 z-50 flex items-center justify-center bg-zinc-950/85 backdrop-blur-sm" style="display: none;">
        <div class="flex flex-col items-center gap-5 max-w-sm text-center p-6 rounded-2xl bg-zinc-900/80 border border-zinc-800/50 shadow-2xl shadow-black/50">
          <div class="w-14 h-14 rounded-full bg-red-900/30 border border-red-800/50 flex items-center justify-center">
            <svg class="w-7 h-7 text-red-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"/>
              <path d="M12 8v4"/>
              <path d="M12 16h.01"/>
            </svg>
          </div>
          <div>
            <h3 class="text-base font-semibold text-zinc-100 mb-1.5">Backend Unreachable</h3>
            <p class="error-message text-sm text-zinc-400 leading-relaxed">Could not connect to the API server.</p>
          </div>
          <div class="flex gap-3">
            <button id="error-retry-btn" class="px-4 py-2 rounded-lg bg-blue-600 text-white text-sm font-medium hover:bg-blue-500 transition-all duration-200 shadow-lg shadow-blue-900/30">
              Retry
            </button>
            <button id="error-mock-btn" class="px-4 py-2 rounded-lg bg-zinc-800 text-zinc-300 text-sm font-medium hover:bg-zinc-700 transition-all duration-200 border border-zinc-700/50">
              Load Demo Data
            </button>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
