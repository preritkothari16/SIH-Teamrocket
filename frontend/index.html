<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SAR Oil Spill Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  </head>
  <body class="bg-zinc-950 text-zinc-100 font-sans overflow-hidden">
    <div id="app" class="h-screen w-screen relative">
      <!-- Globe: full-viewport base layer -->
      <div class="absolute inset-0 z-0">
        <div id="globe-container" class="w-full h-full">
          <canvas id="globe-canvas" class="w-full h-full"></canvas>
        </div>
      </div>

      <!-- Header bar -->
      <header class="absolute top-0 left-0 right-0 h-12 flex items-center px-4 justify-between z-40 pointer-events-none">
        <div class="flex items-center gap-2 pointer-events-auto">
          <svg class="w-5 h-5 text-red-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2L2 22h20L12 2z"/>
            <path d="M12 8v4"/>
            <path d="M12 16h.01"/>
          </svg>
          <h1 class="text-sm font-semibold tracking-tight">SAR Oil Spill</h1>
          <span class="text-xs text-zinc-500 hidden sm:inline">Detection &amp; Attribution</span>
        </div>
        <div class="flex items-center gap-2 pointer-events-auto">
          <button id="run-list-toggle" class="hidden text-xs px-2.5 py-1.5 rounded bg-zinc-800/80 backdrop-blur border border-zinc-700 text-zinc-300 hover:bg-zinc-700 transition-colors">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
          </button>
          <button id="refresh-btn" class="text-xs px-2.5 py-1.5 rounded bg-zinc-800/80 backdrop-blur border border-zinc-700 text-zinc-300 hover:bg-zinc-700 transition-colors" title="Refresh from backend">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 11-6.219-8.56"/><polyline points="21 3 21 9 15 9"/></svg>
          </button>
          <button id="clear-btn" class="text-xs px-2.5 py-1.5 rounded bg-zinc-800/80 backdrop-blur border border-zinc-700 text-zinc-300 hover:bg-zinc-700 transition-colors">
            Clear
          </button>
        </div>
      </header>

      <!-- RunList: collapsible left sidebar -->
      <aside id="run-list-panel" class="absolute top-12 left-0 bottom-0 w-72 z-20 bg-zinc-900 border-r border-zinc-800 flex flex-col overflow-hidden transition-transform duration-300 -translate-x-full lg:translate-x-0">
        <div class="p-3 border-b border-zinc-800">
          <h2 class="text-xs font-semibold text-zinc-400 uppercase tracking-wider">Spills</h2>
        </div>
        <div id="run-list" class="flex-1 overflow-y-auto"></div>
      </aside>

      <!-- SpillOverlay: bottom-right detail card -->
      <div id="spill-overlay" class="absolute bottom-4 right-4 z-20 w-80 max-h-[60vh] overflow-y-auto"></div>

      <!-- VesselDrawer: bottom drawer -->
      <div id="vessel-drawer" class="absolute bottom-0 left-0 right-0 z-20 bg-zinc-900/95 backdrop-blur border-t border-zinc-800 transition-transform duration-300 translate-y-full">
        <div class="flex items-center justify-between px-4 py-2 border-b border-zinc-800">
          <h3 class="text-xs font-semibold text-zinc-400 uppercase tracking-wider">Vessels</h3>
          <button id="vessel-drawer-close" class="text-zinc-500 hover:text-zinc-300 transition-colors">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
          </button>
        </div>
        <div id="vessel-drawer-content" class="max-h-[35vh] overflow-y-auto"></div>
      </div>

      <!-- Globe legend: top-right, clear of RunList -->
      <div id="globe-legend" class="absolute top-14 right-4 z-20 bg-zinc-900/95 backdrop-blur border border-zinc-700 rounded-lg p-2.5 text-xs space-y-1">
        <div class="font-medium text-zinc-300 mb-1">Alert Status</div>
        <div class="flex items-center gap-2"><div class="w-2 h-2 rounded-full" style="background:rgb(255,77,77)"></div><span class="text-zinc-400">New</span></div>
        <div class="flex items-center gap-2"><div class="w-2 h-2 rounded-full" style="background:rgb(255,140,38)"></div><span class="text-zinc-400">Update</span></div>
        <div class="flex items-center gap-2"><div class="w-2 h-2 rounded-full" style="background:rgb(242,217,51)"></div><span class="text-zinc-400">Possible</span></div>
        <div class="flex items-center gap-2"><div class="w-2 h-2 rounded-full" style="background:rgb(102,102,102)"></div><span class="text-zinc-400">None</span></div>
      </div>

      <!-- Empty-state hint -->
      <div id="globe-hint" class="absolute bottom-6 left-1/2 -translate-x-1/2 z-10 text-zinc-500 text-xs pointer-events-none transition-opacity duration-300">
        Select a spill to view details
      </div>

      <!-- Loading state: centered spinner -->
      <div id="loading-state" class="absolute inset-0 z-50 flex items-center justify-center bg-zinc-950/60" style="display: flex;">
        <div class="flex flex-col items-center gap-3">
          <div class="w-8 h-8 border-2 border-zinc-600 border-t-blue-500 rounded-full animate-spin"></div>
          <span class="text-sm text-zinc-400">Loading spills from backend...</span>
        </div>
      </div>

      <!-- Error state: centered message with retry -->
      <div id="error-state" class="absolute inset-0 z-50 flex items-center justify-center bg-zinc-950/80" style="display: none;">
        <div class="flex flex-col items-center gap-4 max-w-sm text-center">
          <svg class="w-10 h-10 text-red-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <path d="M12 8v4"/>
            <path d="M12 16h.01"/>
          </svg>
          <div>
            <h3 class="text-sm font-medium text-zinc-200 mb-1">Backend unreachable</h3>
            <p class="error-message text-xs text-zinc-500">Could not connect to the API server.</p>
          </div>
          <div class="flex gap-2">
            <button id="error-retry-btn" class="px-3 py-1.5 rounded bg-blue-600 text-white text-xs font-medium hover:bg-blue-500 transition-colors">
              Retry
            </button>
            <button id="error-mock-btn" class="px-3 py-1.5 rounded bg-zinc-700 text-zinc-300 text-xs font-medium hover:bg-zinc-600 transition-colors">
              Load demo data
            </button>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
