# sar-oilspill configuration
#
# Every value here can be overridden by an environment variable using the
# prefix SAROIL_ and "__" between nesting levels, e.g.:
#   SAROIL_DETECTION__PROB_THRESHOLD=0.65
#   SAROIL_PATHS__RAW_DIR=/mnt/bigdisk/raw
# Secrets are NEVER stored here - only the *names* of the env vars that hold
# them (see the credentials block and .env.example).

project_name: sar-oilspill

# --- area of interest + on-disk data layout (paths are relative to repo root) ---
paths:
  aoi_geojson: configs/aoi.geojson
  data_dir: data
  raw_dir: data/raw
  processed_dir: data/processed
  ais_dir: data/ais
  env_dir: data/env
  alerts_dir: data/alerts
  models_dir: models

# --- names of the env vars holding each credential (values live in .env) ---
credentials:
  cdse_client_id_env: CDSE_CLIENT_ID
  cdse_client_secret_env: CDSE_CLIENT_SECRET
  cds_api_key_env: CDS_API_KEY
  cmems_username_env: CMEMS_USERNAME
  cmems_password_env: CMEMS_PASSWORD
  database_url_env: DATABASE_URL

# --- satellite product search (step 1.x) ---
ingestion:
  collection: SENTINEL-1
  product_type: GRD
  sensor_mode: IW
  polarisation: VV
  max_products_per_query: 10
  search_lookback_days: 3

# --- SAR preprocessing (step 2.x) ---
# Tile size and overlap are NOT here: tiles exist to feed the segmentation
# model, so detection.tile_size / detection.tile_overlap own those numbers.
preprocessing:
  target_resolution_m: 40.0
  calibrate_to: sigma0
  output_crs: EPSG:4326
  input_is_db: null              # null = detect from the pixel values
  calibration_constant_db: 0.0   # fallback when a product has no sigma0 LUT
  number_of_looks: 4.4           # Sentinel-1 IW GRDH ENL, drives Lee weighting
  speckle_filter: lee            # lee | refined_lee | none
  speckle_filter_size: 7
  coastline_path: configs/coastline/ne_10m_land_aoi.geojson
  coastline_url: https://naciscdn.org/naturalearth/10m/physical/ne_10m_land.zip
  land_buffer_m: 500.0           # push the coastline seaward, coast is noisy
  nodata: .nan
  tile_min_valid_fraction: 0.1   # drop tiles that are mostly land or nodata

# --- spill segmentation + look-alike rejection (step 3.x) ---
detection:
  model_arch: unet
  encoder: resnet34
  tile_size: 512
  tile_overlap: 64
  prob_threshold: 0.5              # sigmoid cutoff for spill mask
  min_spill_area_km2: 0.05         # drop specks below this
  dark_patch_max_sigma0_db: -22.0  # dark = candidate slick
  lookalike_min_contrast_db: 3.0   # slick vs surrounding sea contrast
  lookalike_min_wind_speed_ms: 3.0 # too calm -> low-wind look-alike
  lookalike_max_wind_speed_ms: 12.0 # too rough -> slick not visible
  # --- inference (step 1.4) ---
  checkpoint_path: models/best.pt
  batch_size: 8
  input_db_min: -35.0            # dB window mapped onto the 0-255 the model saw
  input_db_max: 0.0
  # --- look-alike rejection (step 1.5) ---
  min_blob_pixels: 50            # below this a blob is speckle, not a slick
  lookalike_min_elongation: 1.8  # slicks drift into streaks; look-alikes are blobby
  lookalike_min_edge_gradient: 0.5  # dB per pixel across the blob boundary
  lookalike_ring_pixels: 15      # width of the surrounding ring used for contrast

# --- segmentation training (step 3.1) ---
# The MKLab / Krestenitis oil-spill dataset uses a 5-class scheme; the order
# here IS the label index order, so do not reorder it.
training:
  dataset_dir: data/raw/mklab
  num_classes: 5
  class_names: [sea, oil_spill, look_alike, ship, land]
  in_channels: 3
  encoder_weights: imagenet     # null to train from scratch / stay offline
  image_size: 512
  batch_size: 8
  epochs: 40
  learning_rate: 0.0003
  weight_decay: 0.0001
  val_split: 0.15
  num_workers: 0                # >0 needs the __main__ guard on Windows
  seed: 42
  loss: dice_ce                 # dice_ce | ce
  dice_weight: 0.5
  class_weights: null           # null = inverse frequency from the train split
  max_class_weight: 50.0
  amp: true                     # only takes effect on CUDA
  checkpoint_metric: oil_spill  # class whose IoU selects the best checkpoint
  early_stopping_patience: 10

# --- characterization (step 3.x) ---
characterization:
  thickness_classes: [sheen, rainbow, thick]
  volume_estimate_thickness_um: 1.0
  simplify_tolerance_m: 30.0     # polygon simplification, ~ one preprocessed pixel
  min_polygon_area_km2: 0.01     # drop slivers left by the mask edges
  spills_dirname: spills         # under data/processed/

# --- alerting (step 4.x) ---
alerts:
  min_confidence: 0.7              # below this -> rejected, no alert raised
  min_area_km2: 0.1                # below this -> rejected, too small to report
  severity_area_km2:               # lower bound of each severity band
    low: 0.1
    medium: 5.0
    high: 20.0
    critical: 100.0
  coastline_proximity_km: 25.0     # escalate if slick this close to shore

  # detectable wind band: outside it, still register but mark "possible"
  wind_min_speed_ms: 2.0
  wind_max_speed_ms: 12.0

  # optional GeoJSON of known natural seeps / platforms; null -> none configured
  exclusion_zones_path: null

  # dedup: a later detection within this window, overlapping or within this
  # many km of an already-registered event, updates it instead of creating
  # a new spill ID
  dedup_window_days: 3.0
  dedup_buffer_km: 5.0

# --- AIS retrieval + track reconstruction (step 2.1-2.2) ---
ais:
  search_window_hours: 48          # look-back only: [acquisition - this, acquisition]
  search_radius_km: 25.0           # spill-bbox buffer for the search, and the CPA cutoff
  interpolation_minutes: 15.0      # cadence used to fill gaps between sparse AIS pings
  min_moving_speed_knots: 0.5      # at/below this for the whole window -> moored, not a suspect
  max_candidate_vessels: 50

# --- vessel attribution scoring (step 2.3) ---
attribution:
  spatial_scale_km: 10.0           # spatial_score decays to ~0.37 at this CPA distance

  # temporal_score peaks at temporal_optimal_lag_hours before acquisition and
  # falls off in both directions (a Gaussian bump, not a straight line): very
  # recent transits are penalised because oil needs time to spread into a
  # visible slick, and old ones because the vessel could be long gone by then.
  temporal_optimal_lag_hours: 6.0
  temporal_scale_hours: 8.0

  # alignment_score compares the vessel's heading at CPA to the slick's major
  # axis - the strongest single discriminator of the four (see scoring.py).

  # type_prior: configurable per vessel type. Tankers/cargo carry the bulk
  # oil that causes a spill of this scale; fishing/leisure rarely do.
  type_priors:
    tanker: 1.0
    cargo: 0.8
    passenger: 0.4
    fishing: 0.3
    other: 0.3
    leisure: 0.2
  default_type_prior: 0.3          # vessel_type missing or not in the table above

  # combination weights - must sum to 1.0
  weight_spatial: 0.25
  weight_temporal: 0.15
  weight_alignment: 0.30
  weight_type: 0.15
  # step 5.2: bonus factors, see src/attribution/anomaly_features.py
  weight_gap: 0.075
  weight_speed_change: 0.075

  # step 4.4: match candidates against the drift-hindcast corridor instead of
  # the spill's fixed, final polygon. Off by default.
  use_hindcasting: false

  # step 5.2: AIS anomaly feature tunables
  min_gap_hours: 1.0             # AIS gaps at/below this are routine, not suspicious
  gap_scale_hours: 6.0           # gap_score saturation scale
  min_baseline_speed_knots: 3.0  # below this, too slow overall to assess a further slowdown

# --- environmental data: wind (step 3.1), currents later (step 4.1) ---
env_data:
  wind_dataset_path: null        # local/cached NetCDF (ERA5 u10/v10); null -> CDS API if configured
  interpolation_method: linear   # linear | nearest, spatial lookup
  cds_area_buffer_deg: 1.0       # bounding-box half-width around a CDS wind fetch request
  current_dataset_path: null     # local/cached NetCDF (CMEMS/HYCOM uo/vo); null -> CMEMS if configured
  cmems_area_buffer_deg: 1.0     # bounding-box half-width around a CMEMS current fetch request

# --- drift prediction (step 5.x) ---
drift:
  forecast_hours: 48
  timestep_hours: 1.0              # step size; sign flips for hindcasting
  snapshot_interval_hours: 6.0
  wind_drift_factor: 0.03          # fraction of wind velocity added to surface current
  wind_deflection_deg: 15.0        # Ekman deflection, right of wind (N hemisphere default)
  diffusion_std_ms: 0.05           # small random-walk velocity noise per step
  n_particles: 1000

# --- dashboard / api ---
api:
  host: 127.0.0.1
  port: 8000
